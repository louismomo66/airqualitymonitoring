version: "3.9"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: aq_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: aq_postgres
    environment:
      POSTGRES_USER: aquser
      POSTGRES_PASSWORD: aqpass
      POSTGRES_DB: airquality
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: aq_backend
    depends_on:
      - mosquitto
      - postgres
    environment:
      DATABASE_URL: postgres://aquser:aqpass@postgres:5432/airquality?sslmode=disable
      MQTT_BROKER: tcp://mosquitto:1883
      MQTT_TOPIC: airquality/data
      PORT: "8080"
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: aq_frontend
    depends_on:
      - backend
    ports:
      - "9080:80"
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_logs:
  postgres_data:
