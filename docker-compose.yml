version: "3.9"

# ── Production deployment ─────────────────────────────────────────────────
# 1. Copy .env.example to .env and set real credentials
# 2. Run:  docker compose up -d --build
# 3. App:  http://<your-server>:9080
# 4. API:  http://<your-server>:8080
#
# Mosquitto is NOT included — the app uses the external broker in .env

services:

  # ── Database ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aq_postgres
    env_file: .env
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Only expose to localhost — not needed externally in production
    # Comment out the ports block to harden the deployment
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Go backend ───────────────────────────────────────────
  backend:
    build: ./backend
    container_name: aq_backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      MQTT_BROKER:  ${MQTT_BROKER}
      MQTT_USER:    ${MQTT_USER}
      MQTT_PASS:    ${MQTT_PASS}
      MQTT_TOPIC:   ${MQTT_TOPIC}
      PORT:         ${PORT:-8080}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── React frontend (served by nginx) ─────────────────────
  frontend:
    build: ./frontend
    container_name: aq_frontend
    ports:
      - "9080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
